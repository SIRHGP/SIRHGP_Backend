# DDL : Hibernate recrée/met à jour le schéma automatiquement
spring.jpa.hibernate.ddl-auto=update

# Affichage SQL dans les logs (utile en dev, désactivé en prod)
spring.jpa.show-sql=true

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200
logging.level.org.springframework.web=DEBUG


# Logs verbeux en dev
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.example.backend_sirhgp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
# Credentials base de données locale
