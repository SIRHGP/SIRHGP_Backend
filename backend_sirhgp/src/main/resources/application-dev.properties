# ============================================================
# Development profile
# ============================================================

# DDL : Hibernate recrÃ©e/met Ã  jour le schÃ©ma automatiquement
spring.jpa.hibernate.ddl-auto=update
app.initialize-data=${APP_INIT_DATA:true}

# SQL output can contain personal data; keep it disabled unless explicitly needed.
spring.jpa.show-sql=false

app.cors.allowed-origins=http://localhost:5000,http://localhost:5173,http://localhost:3000,http://localhost:4200
# Keep request DTOs (including login credentials) out of Spring MVC debug logs.
logging.level.org.springframework.web=INFO
# Authentication debug logs can expose account identifiers and internal details.
logging.level.org.springframework.security=WARN
# Application diagnostics without dumping SQL parameters or request bodies.
logging.level.org.springframework=INFO
logging.level.com.example.backend_sirhgp=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
# Optional: JWT_SECRET can be set in the environment when local tokens must
# remain valid across backend restarts. Never keep a fixed development key here.
