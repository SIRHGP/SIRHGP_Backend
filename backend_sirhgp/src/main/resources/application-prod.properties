# ============================================================
#  application-prod.properties  ?  Profil production
# ============================================================

# DDL : validate uniquement ? Hibernate vérifie mais ne modifie JAMAIS le schéma
# Utiliser Flyway ou Liquibase pour les migrations en prod
spring.jpa.hibernate.ddl-auto=validate

# SQL désactivé en prod (performances + sécurité)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logs minimalistes en prod
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.com.example.backend_sirhgp=INFO

# Désactiver l'initialisation automatique des données en prod
app.initialize-data=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}