# ============================================================
#  application-prod.properties  ?  Profil production
# ============================================================

# DDL : validate uniquement ? Hibernate vérifie mais ne modifie JAMAIS le schéma
# Les migrations ponctuelles sont appliquees manuellement avant le deploiement.
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# SQL désactivé en prod (performances + sécurité)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logs minimalistes en prod
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.com.example.backend_sirhgp=INFO

# Keep development seed data and account normalization disabled in production.
app.initialize-data=false
app.migrate-legacy-secretary-role=${APP_MIGRATE_LEGACY_SECRETARY_ROLE:false}
app.cors.allowed-origins=${CORS_ORIGINS}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
