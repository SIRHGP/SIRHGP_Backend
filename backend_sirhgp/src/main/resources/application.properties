# ============================================================
#  application.properties  ?  Configuration commune (tous profils)
# ============================================================

spring.application.name=backend_sirhgp

# Profil actif par défaut (surcharger en prod via variable d'env : SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== SERVEUR =====
server.port=${SERVER_PORT:8080}

# ===== BASE DE DONNÉES =====
# CORRECTION : plus jamais de credentials en dur ? variables d'environnement
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sirhgp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool HikariCP (valeurs raisonnables pour un projet RH)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===== JPA / HIBERNATE =====
# CORRECTION : ddl-auto défini par profil (voir application-dev/prod.properties)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# CORRECTION : open-in-view=false évite les requêtes lazy hors transaction silencieuses

# ===== UPLOADS =====
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== PAGINATION =====
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ===== JWT =====
# CORRECTION : secret via variable d'env obligatoire ? minimum 32 caractères (256 bits)
#jwt.secret=${JWT_SECRET:}
#jwt.expiration=${JWT_EXPIRATION:86400000}
# 86400000 ms = 24h. Envisager 3600000 (1h) + refresh token en prod.

# ===== INITIALISATION DES DONNÉES =====
app.initialize-data=${APP_INIT_DATA:true}

# ===== CORS =====
# Géré dans SecurityConfig, mais on centralise les origines autorisées ici
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}

# Email configuration (à adapter selon votre fournisseur)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=votre_email@gmail.com
spring.mail.password=votre_mot_de_passe
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true