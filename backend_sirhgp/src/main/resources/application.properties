# ============================================================
#  application.properties  ?  Configuration commune (tous profils)
# ============================================================

spring.application.name=backend_sirhgp

# Profil actif par défaut (surcharger en prod via variable d'env : SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== SERVEUR =====
server.port=${SERVER_PORT:8080}

# ===== BASE DE DONNÉES =====
# Keep database credentials outside the source tree; configure DB_USERNAME and DB_PASSWORD locally.
# Les identifiants doivent être fournis par l'environnement local ou le lanceur PowerShell.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sirhgp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool HikariCP (valeurs raisonnables pour un projet RH)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# Échec immédiat si une connexion ne peut pas être établie.

# ===== JPA / HIBERNATE =====
# Dialecte explicite requis : sans connexion JDBC réussie, Hibernate ne peut pas
# auto-détecter le dialecte MySQL. MySQLDialect est déprécié en Hibernate 6 mais
# fonctionne encore ; il sera remplacé par la détection automatique une fois la
# connexion DB établie (voir doc/REFERENCE-SIRHGP.md §1.7).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
# open-in-view=false avoids lazy database access after a service transaction has ended.

# ===== UPLOADS =====
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== PAGINATION =====
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ===== JWT =====
# JWT_SECRET is required outside dev and must be Base64 encoding of at least 32 random bytes.
# Dev generates a fresh in-memory secret when this variable is omitted.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
# 86400000 ms = 24h. Envisager 3600000 (1h) + refresh token en prod.

# ===== INITIALISATION DES DONNÉES =====
app.initialize-data=${APP_INIT_DATA:false}
app.migrate-legacy-secretary-role=${APP_MIGRATE_LEGACY_SECRETARY_ROLE:false}

# ===== CORS =====
# Géré dans SecurityConfig, mais on centralise les origines autorisées ici
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}

# Email configuration (à adapter selon votre fournisseur)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
