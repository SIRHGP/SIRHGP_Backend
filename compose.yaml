services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sirhgp_db
      MYSQL_USER: sirhgp_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definis DB_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definis MYSQL_ROOT_PASSWORD dans .env}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - sirhgp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend_sirhgp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/sirhgp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: sirhgp_app
      DB_PASSWORD: ${DB_PASSWORD:?Definis DB_PASSWORD dans .env}
      APP_INIT_DATA: "true"
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:5000,http://localhost:5173
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - sirhgp_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  sirhgp_mysql_data:
  sirhgp_uploads:
